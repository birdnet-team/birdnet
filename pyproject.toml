[project]
name = "birdnet"
version = "0.2.16"
description = "A Python library for identifying bird species by their sounds."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Stefan Taubert" }]
maintainers = [{ name = "Stefan Taubert" }, { name = "Josef Haupt" }]
keywords = [
  "birds",
  "deep-learning",
  "birdsong",
  "acoustic-monitoring",
  "bioacoustics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: BSD",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Unix",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "soundfile >= 0.11.0",  # 2022/09/27
  "scipy >= 1.8.0",       # 2022/02/05
  "ordered-set >= 4.1.0", # 2022/01/26
  "tqdm >= 4.64.0",       # 2022/04/04
  "numpy >= 1.22.0",      # 2021/12/31
  "pandas >= 1.4.0",      # 2022/02/22
  "psutil >= 5.9.0",      # 2021/12/29
  "pyarrow >= 7.0.0",     # 2022/02/03
  # Used to download the official models (birdnet.utils.helper.download_file_tqdm).
  # Previously pulled in transitively via TensorFlow; declared explicitly so the
  # TensorFlow-free install on Python 3.14 (onnx/pt backends) can download models.
  "requests >= 2.27.0",   # 2022/01/05
  # TensorFlow has no wheels for Python 3.14+ yet, so it is only required on
  # <=3.13. On Python 3.14 birdnet installs without TensorFlow; the acoustic 3.0
  # model then runs via the optional 'onnx'/'pt' backends. TF/PB backends and all
  # geo models raise a clear error there until TF ships cp314 wheels (issue #55).
  "tensorflow >= 2.8.0 ; (sys_platform != 'darwin' or platform_machine != 'x86_64') and python_version < '3.14'",                                                                                                # 2022/02/02
  "tensorflow >= 2.8.0, <2.17 ; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.14'",
  "ai-edge-litert >= 2.0.2 ; python_version <= '3.13' and (sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'win32' and platform_machine == 'AMD64'))", # 2026/05/12
]

[project.optional-dependencies]
and-cuda = [
  "tensorflow[and-cuda] >= 2.8.0 ; sys_platform == 'linux' and python_version < '3.14'", # 2022/02/02
]
pt = ["torch >= 2.0.0"]
onnx = ["onnxruntime >= 1.16.0"]
repro = [
  # Reproducible results only with Python 3.12 and on CPU and not on macOS Intel
  # Direct dependencies
  "soundfile == 0.12.1",
  "scipy == 1.16.3",
  "ordered-set == 4.1.0",
  "tqdm == 4.67.1",
  "numpy == 2.1.0",
  "pandas == 2.3.3",
  "psutil == 7.1.3",
  "pyarrow == 22.0.0",
  "tensorflow == 2.20.0 ; sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'windows' and platform_machine == 'amd64')",
  "ai-edge-litert == 2.0.3 ; python_version < '3.13' and sys_platform == 'linux'",
  # Indirect dependencies
  "absl-py == 2.3.1",
  "astunparse == 1.6.3",
  "backports.strenum == 1.2.8",
  "certifi == 2025.11.12",
  "cffi == 2.0.0",
  "charset-normalizer == 3.4.4",
  "flatbuffers == 25.9.23",
  "gast == 0.6.0",
  "google-pasta == 0.2.0",
  "grpcio == 1.76.0",
  "h5py == 3.15.1",
  "idna == 3.11",
  "keras == 3.12.0",
  "libclang == 18.1.1",
  "Markdown == 3.10",
  "markdown-it-py == 4.0.0",
  "MarkupSafe == 3.0.3",
  "mdurl == 0.1.2",
  "ml_dtypes == 0.5.4",
  "namex == 0.1.0",
  "opt_einsum == 3.4.0",
  "optree == 0.18.0",
  "packaging == 25.0",
  "pillow == 12.0.0",
  "protobuf == 6.33.1",
  "pycparser == 2.23",
  "Pygments == 2.19.2",
  "python-dateutil == 2.9.0.post0",
  "pytz == 2025.2",
  "pyyaml == 6.0.3",
  "requests == 2.32.5",
  "rich == 14.2.0",
  "setuptools == 80.9.0",
  "six == 1.17.0",
  "tensorboard == 2.20.0",
  "tensorboard-data-server == 0.7.2",
  "termcolor == 3.2.0",
  "typing_extensions == 4.15.0",
  "tzdata == 2025.2",
  "urllib3 == 2.5.0",
  "Werkzeug == 3.1.3",
  "wheel == 0.45.1",
  "wrapt == 2.0.1",
]
tests = [
  "tox >= 4.32.0",
  "uv >= 0.9.7",
  "pytest >= 8.4.2",
  "pytest-cov >= 7.0.0",
  "pytest-xdist >= 3.8.0",
  "pytest-timeout >= 2.4.0",
  "mypy >= 1.18.2",
  "ruff >= 0.14.4",
  "build >= 1.3.0",
  "twine >= 6.2.0",
]
dev = [
  "jupyter",
  "uv",
  "ruff",
  "mypy",
  "rope",
  "build",
  "twine",
  "scipy-stubs",
  "tuna",
  "pyarrow-stubs",
  "pygount",
  "types-tqdm",
  "types-requests",
  "pandas-stubs",
  "types-tensorflow",
]
docs = [
  "sphinx == 8.2.3",
  "sphinx-autodoc-typehints == 3.5.2",
  "sphinx-autobuild == 2025.8.25",
  "numpydoc == 1.10.0",
  "myst-parser == 4.0.1",
]

[project.urls]
Homepage = "https://github.com/birdnet-team/birdnet"
Issues = "https://github.com/birdnet-team/birdnet/issues"
Documentation = "https://birdnet-team.github.io/birdnet"
Repository = "https://github.com/birdnet-team/birdnet.git"
Changelog = "https://github.com/birdnet-team/birdnet/blob/master/CHANGELOG.md"

[project.scripts]
birdnet-benchmark = "birdnet_benchmark.cli:run_benchmark"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
packages = ["birdnet"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["birdnet", "birdnet.*", "birdnet_benchmark", "birdnet_benchmark.*"]
exclude = ["birdnet_tests", "birdnet_tests.*"]
namespaces = true

[tool.pytest.ini_options]
log_cli = true
log_level = "DEBUG"
timeout = 300
# The signal method cannot interrupt a thread blocked in a C call, so a deadlocked
# fork child let the run hang until the job limit killed it hours later. The thread
# method kills the process instead, turning such hangs into a failure with a stack
# dump. Windows already uses it, since it has no SIGALRM.
timeout_method = "thread"
addopts = ["--max-worker-restart=0"]
testpaths = ["src/birdnet_tests"]
norecursedirs = ["src/birdnet_v1_tests"]
markers = [
  "load_model: tests that download all models, should be run before other tests",
  "litert: tests requiring ai_edge_litert backend which can not be loaded after tf is imported (raises ImportError) which happens on parallel test runs",
  "gpu: tests requiring a GPU to run and to be run sequentially",
  "repro: tests requiring exact package versions to reproduce results",
  "no_tf: tests for the TensorFlow-free surface, run when TF is absent (e.g. Python 3.14)",
  "fork: tests that force the fork start method; run in a dedicated serial (-n 1) lane in a fresh process so a fork-after-TensorFlow deadlock cannot wedge the parallel general-phase workers (see conftest.py for why the default is otherwise spawn)",
]

[tool.ruff]
src = ["src/birdnet"]
line-length = 88
indent-width = 2

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # Pyflakes
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "I",    # isort
  "C4",
  "T20",
  "PERF",
  "ANN",
  "TID",
  "EXE",
  "W",
  # "D",
]

[tool.ruff.lint.isort]
known-first-party = ["birdnet*"]

[tool.coverage.run]
branch = true
source = ["src/birdnet"]
parallel = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__ == .__main__.:"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py{311,312,313,314}, py312-repro
isolated_build = True

[testenv]
package = wheel
allowlist_externals = uv, pyproject-build
install_command = uv pip install {opts} {packages}
skip_missing_interpreters = true
# Forward the model-cache location (set in CI) into the test subprocess; without
# this tox strips it and models download to the default dir, defeating the cache.
passenv = BIRDNET_APP_DATA

deps = 
  .[tests,and-cuda,pt,onnx]
commands = 
  # ruff check src/birdnet
  # ruff check src/birdnet_tests
  # mypy src/birdnet
  pytest -m "not repro and load_model" -n auto
  pytest -m "not repro and not load_model and (not litert and not gpu and not fork)" -n auto
  pytest -m "not repro and not load_model and litert and not fork" -n auto
  pytest -m "not repro and not load_model and gpu" -n 1
  # Fork tests run last, serially, in a fresh process (see the `fork` marker and
  # conftest.py). A fork-after-TensorFlow deadlock here can only wedge this isolated
  # lane, not the parallel general phase, whose results are already recorded. The
  # litert/non-litert split mirrors the phases above (litert can't load after TF).
  pytest -m "not repro and not load_model and fork and not litert and not gpu" -n 1
  pytest -m "not repro and not load_model and fork and litert and not gpu" -n 1
  # build and check package
  # note `python -m build` uses the isolated build folder which results in import error:
  # 'No module named build.__main__; 'build' is a package and cannot be directly executed'
  pyproject-build -o dist/
  python -m twine check dist/*

[testenv:py312-repro]
deps =
  .[tests,repro]
commands = 
  pytest -m "load_model" -n auto
  # run normal tests including repro tests
  pytest -m "not load_model and (not litert and not gpu and not fork)" -n auto
  # run litert tests including repro tests
  pytest -m "not load_model and litert and not fork" -n auto
  # fork tests isolated + serial (see the `fork` marker and conftest.py)
  pytest -m "not load_model and fork and not litert and not gpu" -n 1
  pytest -m "not load_model and fork and litert and not gpu" -n 1
  # gpu tests are not supported to be run with repro environment
  pyproject-build -o dist/
  python -m twine check dist/*
  
[testenv:py314]
# Python 3.14 has no TensorFlow wheels yet (issue #55). Install the TF-free
# surface (onnx backend) and exercise it plus the friendly errors on TF paths.
deps =
  .[tests,onnx]
commands =
  pytest -m "no_tf" -n auto
  pyproject-build -o dist/
  python -m twine check dist/*

[testenv:py312-coverage]
deps =
  .[tests]
commands =
  coverage erase
  pytest -m "not repro and load_model" -n auto --cov=src/birdnet --cov-append --cov-report=
  pytest -m "not repro and not load_model and (not litert and not gpu and not fork)" -n auto --cov=src/birdnet --cov-append --cov-report=
  pytest -m "not repro and not load_model and litert and not fork" -n auto --cov=src/birdnet --cov-append --cov-report=
  pytest -m "not repro and not load_model and gpu" -n 1 --cov=src/birdnet --cov-append --cov-report=
  # fork tests isolated + serial (see the `fork` marker and conftest.py)
  pytest -m "not repro and not load_model and fork and not litert and not gpu" -n 1 --cov=src/birdnet --cov-append --cov-report=
  pytest -m "not repro and not load_model and fork and litert and not gpu" -n 1 --cov=src/birdnet --cov-append --cov-report=
  coverage report
"""

[build-system]
requires = [
  "setuptools >= 80.9.0", # 2025/05/27
  "wheel >= 0.45.1",      # 2024/11/23
]
build-backend = "setuptools.build_meta"

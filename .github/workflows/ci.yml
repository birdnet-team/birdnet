name: CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-and-test-standard:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          [
            ubuntu-slim,
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-15,
            macos-15-intel,
            windows-2025,
          ]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          - os: macos-15-intel
            python-version: "3.13" # no TF support

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install audio system libs (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1

      - name: Install audio system libs (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew update
          brew install libsndfile

      - name: Install audio system libs (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          choco install libsndfile

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install uv --upgrade
          python -m uv pip install --system .[tests]

      - name: Run available tests for current configuration
        run: |
          python -m tox

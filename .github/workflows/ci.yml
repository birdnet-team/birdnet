name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "example/**"      # test data
      - "pyproject.toml"
      - "MANIFEST.in"     # packaging check
      - ".github/workflows/ci.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "example/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-tests:
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    # Backstop for a wedged job, sized for the fattest cell (ubuntu 3.12: py312 +
    # py312-repro + py312-coverage, >50 min when healthy) plus one 600 s
    # fork-lane deadlock.
    timeout-minutes: 65

    env:
      # Under the workspace because job-level env has no `runner` context.
      BIRDNET_APP_DATA: ${{ github.workspace }}/.birdnet-app-data
      # Enables the hang watchdog in birdnet_tests/conftest.py.
      BIRDNET_TEST_WATCHDOG_DIR: ${{ github.workspace }}/.watchdog-dumps

    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-15,
            macos-15-intel,
            windows-2025,
          ]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: macos-15-intel
            python-version: "3.13" # no TF support
          - os: macos-15-intel
            python-version: "3.14" # no TF / torch x86 macOS wheels

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install audio system libs (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1

      - name: Install audio system libs (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # No `brew update`: it fetches every preinstalled tap and fails the job on
          # one transient fetch error; `brew install` alone gets the bottle.
          brew install libsndfile

      - name: Install audio system libs (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          # The choco community repo fails transiently.
          $attempts = 0
          while ($true) {
            $attempts++
            choco install libsndfile --no-progress -y
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempts -ge 3) {
              Write-Error "choco install libsndfile failed $attempts times"
              exit 1
            }
            Write-Host "choco install failed (attempt $attempts), retrying in 30 s..."
            Start-Sleep -Seconds 30
          }

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # Keyed on the download profile (full vs the TF-free py3.14 set) plus the
      # model definitions: the files are identical across cells, and one copy per
      # cell overran the 10 GB cache limit. A primary-key hit is never re-saved,
      # so rename the profile when its download set grows.
      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ${{ env.BIRDNET_APP_DATA }}
          key: birdnet-models-${{ matrix.python-version == '3.14' && 'notf-litert' || 'full' }}-${{ hashFiles('src/birdnet/**/models/**/*.py') }}
          restore-keys: |
            birdnet-models-${{ matrix.python-version == '3.14' && 'notf-litert' || 'full' }}-

      - name: Install dependencies
        run: uv pip install --system '.[tests]'

      - name: Run tests py311
        if: matrix.python-version == '3.11'
        run: |
          python -m tox -e py311

      - name: Run tests py312
        if: matrix.python-version == '3.12'
        run: |
          python -m tox -e py312

      - name: Run tests py313
        if: matrix.python-version == '3.13'
        run: |
          python -m tox -e py313

      - name: Run tests py314
        if: matrix.python-version == '3.14'
        run: |
          python -m tox -e py314

      - name: Run repro tests
        if: matrix.python-version == '3.12' && matrix.os != 'macos-15-intel'
        run: |
          python -m tox -e py312-repro

      - name: Run coverage tests
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: |
          python -m tox -e py312-coverage

      - name: Upload results to Codecov
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: birdnet-team/birdnet

      - name: Extract log path
        id: extract-log-path
        shell: pwsh
        run: |
          $logPaths = @()

          if (Test-Path output.log) {
            $output = Get-Content output.log -Raw
            $pattern = '(?<path>(?:[A-Za-z]:\\|/)[^\r\n]*?\.log)'
            $logPaths = [regex]::Matches($output, $pattern) |
              ForEach-Object { $_.Groups['path'].Value } |
              Sort-Object -Unique |
              Where-Object { Test-Path $_ -PathType Leaf }
          }

          if ($logPaths.Count -gt 0) {
            "log_paths<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            $logPaths | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          else {
            "log_paths=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Upload log file
        if: failure() && steps.extract-log-path.outputs.log_paths != ''
        uses: actions/upload-artifact@v7
        with:
          name: birdnet-log
          path: ${{ steps.extract-log-path.outputs.log_paths }}

      - name: Check for OOM kills (Linux)
        if: failure() && startsWith(matrix.os, 'ubuntu')
        run: sudo dmesg | grep -iE "out of memory|oom-kill|killed process" || echo "no OOM kills logged"

      - name: Upload hang watchdog dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: watchdog-dumps-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .watchdog-dumps/
          if-no-files-found: ignore
          # dot-dir: upload-artifact skips hidden files by default, silently here.
          include-hidden-files: true

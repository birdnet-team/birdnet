name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "example/**"      # test data
      - "pyproject.toml"
      - "MANIFEST.in"     # packaging check
      - ".github/workflows/ci.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "example/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-tests:
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    # Backstop for a wedged job, sized for the fattest cell (ubuntu 3.12: py312 +
    # py312-repro + py312-coverage, >50 min when healthy) plus one 600 s
    # fork-lane deadlock.
    timeout-minutes: 65

    env:
      # Under the workspace because job-level env has no `runner` context.
      BIRDNET_APP_DATA: ${{ github.workspace }}/.birdnet-app-data
      # Enables the hang watchdog in birdnet_tests/conftest.py.
      BIRDNET_TEST_WATCHDOG_DIR: ${{ github.workspace }}/.watchdog-dumps

    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-15,
            macos-15-intel,
            windows-2025,
          ]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: macos-15-intel
            python-version: "3.13" # no TF support
          - os: macos-15-intel
            python-version: "3.14" # no TF / torch x86 macOS wheels

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install audio system libs (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        # A stalled mirror fails the step here instead of eating the job budget.
        timeout-minutes: 10
        run: |
          # Same principle as the other platforms: install from the image's
          # package lists; `apt-get update` fetches from the mirror only on a miss.
          sudo apt-get install -y libsndfile1 || {
            sudo apt-get update
            sudo apt-get install -y libsndfile1
          }

      - name: Install audio system libs (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # No `brew update`: it fetches every preinstalled tap and fails the job on
          # one transient fetch error; `brew install` alone gets the bottle.
          brew install libsndfile

      - name: Install audio system libs (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          # The choco community repo fails transiently.
          $attempts = 0
          while ($true) {
            $attempts++
            choco install libsndfile --no-progress -y
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempts -ge 3) {
              Write-Error "choco install libsndfile failed $attempts times"
              exit 1
            }
            Write-Host "choco install failed (attempt $attempts), retrying in 30 s..."
            Start-Sleep -Seconds 30
          }

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # Keys the model cache on the download set itself -- every quoted download
      # URL and declared byte size and sha256 under src/birdnet -- so a new or
      # updated model busts the key while an edit to the surrounding backend code
      # does not. The checksums matter on their own: a GitHub release asset can be
      # replaced in place, changing the declared sha256 but neither URL nor size.
      # Matching URLs only inside quotes keeps documentation links in docstrings
      # out of it. The floor fails the job if the declarations move somewhere this
      # no longer sees them, which would otherwise freeze the key onto a stale
      # cache; raise it as the download set grows.
      - name: Compute model cache key
        id: model-key
        shell: python
        run: |
          import hashlib, os, pathlib, re

          URL = r"[\"']https://[^\s\"']+"
          NAME = r"(?:dl_size|[A-Za-z_]*(?:DL|DOWNLOAD)_SIZE[A-Za-z_]*)"
          # Tolerates an annotation and Python's numeric separators, so a size
          # declared as `_DL_SIZE: int = 11_078_402` still reaches the key.
          SIZE = rf"{NAME}\s*(?::\s*int\s*)?=\s*([\d_]+)"
          # The optional parenthesis admits a constant wrapped for line length,
          # e.g. `_TAXONOMY_V3_DL_SHA256 = (\n  "..."\n)`.
          SHA_NAME = r"(?:sha256|[A-Za-z_]*SHA256[A-Za-z_]*)"
          SHA = rf"{SHA_NAME}\s*(?::\s*str\s*)?=\s*\(?\s*[\"']([0-9a-f]{{64}})[\"']"

          tokens = set()
          for path in sorted(pathlib.Path("src/birdnet").rglob("*.py")):
            text = path.read_text(encoding="utf-8")
            tokens |= {url.lstrip("\"'") for url in re.findall(URL, text)}
            tokens |= {f"size={size.replace('_', '')}" for size in re.findall(SIZE, text)}
            tokens |= {f"sha256={sha}" for sha in re.findall(SHA, text)}
          if len(tokens) < 45:
            raise SystemExit(f"only {len(tokens)} downloads found -- has the layout moved?")
          digest = hashlib.sha256("\n".join(sorted(tokens)).encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"hash={digest[:16]}\n")

      # The files are identical across cells, so the profile (full vs the TF-free
      # py3.14 set) is the only other component: one copy per cell overran the
      # 10 GB cache limit. Rename the profile when a lane's download set grows: a
      # primary-key hit is never re-saved.
      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ${{ env.BIRDNET_APP_DATA }}
          key: birdnet-models-${{ matrix.python-version == '3.14' && 'notf-all' || 'full' }}-${{ steps.model-key.outputs.hash }}
          restore-keys: |
            birdnet-models-${{ matrix.python-version == '3.14' && 'notf-all' || 'full' }}-

      - name: Install dependencies
        run: uv pip install --system '.[tests]'

      - name: Run tests py311
        if: matrix.python-version == '3.11'
        run: |
          python -m tox -e py311

      - name: Run tests py312
        if: matrix.python-version == '3.12'
        run: |
          python -m tox -e py312

      - name: Run tests py313
        if: matrix.python-version == '3.13'
        run: |
          python -m tox -e py313

      # Base install without the [tf] extra: TensorFlow-free surface + litert lane.
      - name: Run TF-free tests py313
        if: matrix.python-version == '3.13'
        run: |
          python -m tox -e py313-notf

      - name: Run tests py314
        if: matrix.python-version == '3.14'
        run: |
          python -m tox -e py314

      - name: Run repro tests
        if: matrix.python-version == '3.12' && matrix.os != 'macos-15-intel'
        run: |
          python -m tox -e py312-repro

      - name: Run coverage tests
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: |
          python -m tox -e py312-coverage

      - name: Upload results to Codecov
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: birdnet-team/birdnet

      - name: Extract log path
        id: extract-log-path
        shell: pwsh
        run: |
          $logPaths = @()

          if (Test-Path output.log) {
            $output = Get-Content output.log -Raw
            $pattern = '(?<path>(?:[A-Za-z]:\\|/)[^\r\n]*?\.log)'
            $logPaths = [regex]::Matches($output, $pattern) |
              ForEach-Object { $_.Groups['path'].Value } |
              Sort-Object -Unique |
              Where-Object { Test-Path $_ -PathType Leaf }
          }

          if ($logPaths.Count -gt 0) {
            "log_paths<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            $logPaths | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          else {
            "log_paths=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Upload log file
        if: failure() && steps.extract-log-path.outputs.log_paths != ''
        uses: actions/upload-artifact@v7
        with:
          name: birdnet-log
          path: ${{ steps.extract-log-path.outputs.log_paths }}

      - name: Check for OOM kills (Linux)
        if: failure() && startsWith(matrix.os, 'ubuntu')
        run: sudo dmesg | grep -iE "out of memory|oom-kill|killed process" || echo "no OOM kills logged"

      - name: Upload hang watchdog dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: watchdog-dumps-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .watchdog-dumps/
          if-no-files-found: ignore
          # dot-dir: upload-artifact skips hidden files by default, silently here.
          include-hidden-files: true
